
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombi Otishma O'yini</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10151b;color:white;
  font-family:Arial,sans-serif;overflow:hidden
}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#hud{
 position:fixed;top:15px;left:15px;
 background:#000b;padding:15px;border-radius:12px;
 font-size:19px;line-height:1.8
}
#bottom{
 position:fixed;bottom:15px;left:50%;
 transform:translateX(-50%);
 background:#000b;padding:12px 20px;border-radius:12px;
 text-align:center;width:90%;max-width:600px
}
#controls{
 position:fixed;bottom:100px;left:15px;
 display:flex;gap:10px;flex-direction:column
}
button{
 background:#17232e;color:white;border:2px solid #667785;
 padding:12px 20px;border-radius:10px;
 font-size:17px;cursor:pointer
}
button:hover{background:#30485b}
#restart{
 position:fixed;top:50%;left:50%;
 transform:translate(-50%,-50%);
 display:none;text-align:center;background:#000e;
 padding:30px;border-radius:20px
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
❤️ Jon: <span id="hp">100</span><br>
💀 Zombilar: <span id="count">0</span><br>
🔫 O'q: <span id="ammo">30</span> / ∞<br>
🏆 Ochko: <span id="score">0</span>
</div>

<div id="controls">
<button onclick="weapon=0">1 — 🔫 Avtomat</button>
<button onclick="weapon=1">2 — 🔪 Pichoq</button>
</div>

<div id="bottom">
<b id="msg">Zombilarni yo'q qil va tirik qol!</b><br>
W A S D — yurish | Sichqoncha — nishonga olish<br>
Chap tugma — otish | 1/2 — qurol almashtirish | R — o'q to'ldirish
</div>

<div id="restart">
<h1 id="endTitle">O'yin tugadi!</h1>
<p id="endText"></p>
<button onclick="startGame()">Qayta o'ynash</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let player,zombies,bullets,particles;
let keys={},mouse={x:W/2,y:H/2,down:false};
let weapon=0,ammo=30,hp=100,score=0;
let lastShot=0,knifeTime=0,reload=false;
let gameOver=false,spawnTimer=0;
let world={x:0,y:0};

function rand(a,b){return a+Math.random()*(b-a)}

function startGame(){
 player={x:0,y:0,speed:3.4};
 zombies=[];bullets=[];particles=[];
 hp=100;ammo=30;score=0;weapon=0;
 gameOver=false;spawnTimer=0;
 document.getElementById("restart").style.display="none";
 for(let i=0;i<8;i++)spawnZombie();
}

function spawnZombie(){
 let a=rand(0,Math.PI*2);
 let d=rand(450,850);
 zombies.push({
  x:player.x+Math.cos(a)*d,
  y:player.y+Math.sin(a)*d,
  hp:100,speed:rand(.7,1.3),
  size:rand(20,29),
  hit:0
 });
}

function screenX(x){return x-player.x+W/2}
function screenY(y){return y-player.y+H/2}

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==="1")weapon=0;
 if(e.key==="2")weapon=1;
 if(e.key.toLowerCase()==="r")reloadAmmo();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;mouse.y=e.clientY;
});
canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

function reloadAmmo(){
 if(!reload && ammo<30){
  reload=true;
  document.getElementById("msg").textContent="O'q to'ldirilmoqda...";
  setTimeout(()=>{
   ammo=30;reload=false;
   document.getElementById("msg").textContent="Zombilarni yo'q qil!";
  },1200);
 }
}

function shoot(){
 if(weapon===0){
  if(ammo<=0){reloadAmmo();return}
  if(reload)return;
  ammo--;
  let angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);
  let spread=rand(-.045,.045);
  bullets.push({
   x:player.x,y:player.y,
   vx:Math.cos(angle+spread)*13,
   vy:Math.sin(angle+spread)*13,
   life:60
  });
  for(let i=0;i<5;i++){
   particles.push({
    x:player.x+Math.cos(angle)*25,
    y:player.y+Math.sin(angle)*25,
    vx:rand(-3,3)+Math.cos(angle)*5,
    vy:rand(-3,3)+Math.sin(angle)*5,
    life:10,color:"#ffb52e"
   });
  }
 }else{
  knifeTime=Date.now();
  let angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);
  zombies.forEach(z=>{
   let dx=z.x-player.x,dy=z.y-player.y;
   let dist=Math.hypot(dx,dy);
   let a=Math.atan2(dy,dx);
   let diff=Math.atan2(Math.sin(a-angle),Math.cos(a-angle));
   if(dist<100 && Math.abs(diff)<.8){
    z.hp-=100;z.hit=10;
   }
  });
 }
}

function update(){
 if(gameOver)return;

 let dx=0,dy=0;
 if(keys.w)dy--;
 if(keys.s)dy++;
 if(keys.a)dx--;
 if(keys.d)dx++;

 let len=Math.hypot(dx,dy);
 if(len>0){
  player.x+=dx/len*player.speed;
  player.y+=dy/len*player.speed;
 }

 if(mouse.down && Date.now()-lastShot>(weapon===0?120:450)){
  shoot();lastShot=Date.now();
 }

 spawnTimer++;
 if(spawnTimer>100){
  spawnZombie();spawnTimer=0;
 }

 bullets.forEach(b=>{
  b.x+=b.vx;b.y+=b.vy;b.life--;
  zombies.forEach(z=>{
   if(Math.hypot(b.x-z.x,b.y-z.y)<z.size){
    z.hp-=50;z.hit=8;b.life=0;
    for(let i=0;i<5;i++){
     particles.push({
      x:z.x,y:z.y,vx:rand(-3,3),vy:rand(-3,3),
      life:20,color:"#a82b29"
     });
    }
   }
  });
 });
 bullets=bullets.filter(b=>b.life>0);

 zombies.forEach(z=>{
  let a=Math.atan2(player.y-z.y,player.x-z.x);
  let d=Math.hypot(player.x-z.x,player.y-z.y);
  if(d>32){
   z.x+=Math.cos(a)*z.speed;
   z.y+=Math.sin(a)*z.speed;
  }else if(Math.random()<.04){
   hp-=5;
  }
  if(z.hit>0)z.hit--;
 });

 let before=zombies.length;
 zombies=zombies.filter(z=>z.hp>0);
 score+=(before-zombies.length)*10;

 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;p.life--;
 });
 particles=particles.filter(p=>p.life>0);

 if(hp<=0){
  hp=0;gameOver=true;
  document.getElementById("endTitle").textContent="💀 Yutqazding!";
  document.getElementById("endText").textContent="Ochko: "+score;
  document.getElementById("restart").style.display="block";
 }
}

function drawGround(){
 ctx.fillStyle="#303a32";
 ctx.fillRect(0,0,W,H);

 let grid=80;
 let ox=((W/2-player.x)%grid+grid)%grid;
 let oy=((H/2-player.y)%grid+grid)%grid;

 ctx.strokeStyle="#3d493c";
 ctx.lineWidth=1;
 for(let x=ox;x<W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=oy;y<H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // Yo'l
 ctx.fillStyle="#42433e";
 ctx.fillRect(W/2-170,0,340,H);

 ctx.strokeStyle="#59574c";
 ctx.setLineDash([35,30]);
 ctx.beginPath();
 ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);
 ctx.stroke();ctx.setLineDash([]);
}

function drawZombie(z){
 let x=screenX(z.x),y=screenY(z.y);
 if(x<-80||x>W+80||y<-80||y>H+80)return;

 ctx.save();
 ctx.translate(x,y);
 let angle=Math.atan2(player.y-z.y,player.x-z.x);
 ctx.rotate(angle+Math.PI/2);

 // Oyoqlar
 ctx.fillStyle="#292d29";
 ctx.fillRect(-14,8,11,20);
 ctx.fillRect(3,8,11,20);

 // Tana
 ctx.fillStyle=z.hit>0?"#ff5555":"#52634a";
 ctx.fillRect(-18,-15,36,30);

 // Qo'llar
 ctx.fillStyle="#69775a";
 ctx.fillRect(-28,-12,10,27);
 ctx.fillRect(18,-12,10,27);

 // Bosh
 ctx.fillStyle="#8b9872";
 ctx.beginPath();ctx.arc(0,-24,13,0,Math.PI*2);ctx.fill();

 // Ko'zlar
 ctx.fillStyle="#ff2222";
 ctx.fillRect(-7,-28,5,4);
 ctx.fillRect(3,-28,5,4);

 ctx.restore();

 // Sog'liq
 ctx.fillStyle="#111";
 ctx.fillRect(x-20,y-43,40,5);
 ctx.fillStyle="#ef3333";
 ctx.fillRect(x-20,y-43,40*Math.max(0,z.hp/100),5);
}

function drawPlayer(){
 let x=W/2,y=H/2;
 let angle=Math.atan2(mouse.y-y,mouse.x-x);

 // O'yinchi
 ctx.fillStyle="#202b3b";
 ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 if(weapon===0){
  ctx.fillStyle="#17191c";
  ctx.fillRect(5,-7,45,14);
  ctx.fillStyle="#65717c";
  ctx.fillRect(22,-4,30,8);
  ctx.fillStyle="#111";
  ctx.fillRect(15,5,10,13);
 }else{
  ctx.strokeStyle="#ddd";
  ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(48,0);ctx.stroke();
  ctx.fillStyle="#ccc";
  ctx.beginPath();
  ctx.moveTo(45,-4);ctx.lineTo(65,0);ctx.lineTo(45,4);
  ctx.fill();
 }

 ctx.restore();

 // Nishon
 ctx.strokeStyle="white";ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(mouse.x-15,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);
 ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+15,mouse.y);
 ctx.moveTo(mouse.x,mouse.y-15);ctx.lineTo(mouse.x,mouse.y-5);
 ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+15);
 ctx.stroke();
}

function draw(){
 drawGround();

 zombies.forEach(drawZombie);

 bullets.forEach(b=>{
  ctx.fillStyle="#ffdb4d";
  ctx.beginPath();
  ctx.arc(screenX(b.x),screenY(b.y),4,0,Math.PI*2);
  ctx.fill();
 });

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/20);
  ctx.fillStyle=p.color;
  ctx.fillRect(screenX(p.x),screenY(p.y),5,5);
  ctx.globalAlpha=1;
 });

 drawPlayer();

 document.getElementById("hp").textContent=hp;
 document.getElementById("count").textContent=zombies.length;
 document.getElementById("ammo").textContent=ammo;
 document.getElementById("score").textContent=score;
}

function loop(){
 update();draw();
 requestAnimationFrame(loop);
}

startGame();
loop();
</script>
</body>
</html>
